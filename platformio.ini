; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

[env:ATmega2560]
platform = atmelavr
board = megaADK
framework = arduino
; PFTC80_USE_DEBUGLOG routes PfeifferTurboTC80's internal logging through the
; DebugLog library, preserving the behaviour it had when it included DebugLog
; directly. Drop the flag and the driver goes silent.
; Add -D PFEIFFER_VAC_PROTOCOL_INCLUDE_DEBUG=0 here to reclaim the ~40 KB of
; human-readable parameter and error tables. It has to be a build flag: putting
; it in a header only works if that header is parsed first.
build_flags = -Wall -D PFTC80_USE_DEBUGLOG
