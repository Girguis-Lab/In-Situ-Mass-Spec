; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

[env:ATmega2560]
platform = atmelavr
board = megaADK
framework = arduino
lib_deps=
    https://github.com/Girguis-Lab/PfeifferTurboTC80@^1.0.2
; PFTC80_USE_DEBUGLOG routes the PfeifferTurboTC80 librarie's internal logging through the
; DebugLog library, to keep the same logging library as used in the rest of the ISMS code. the driver Drop the flag and the driver goes silent.
; Add -D PFEIFFER_VAC_PROTOCOL_INCLUDE_DEBUG=0 here to reclaim the ~40 KB of
; human-readable parameter and error tables - Note that the ISMS will no longer print helpful messages from the Turbo pump, only raw responses.
; This define has to be a build flag: putting it in a header only works if that header is parsed before the PfeifferTurboTC80 library.
build_flags = -Wall -D PFTC80_USE_DEBUGLOG -D DEBUGLOG_DEFAULT_LOG_LEVEL_TRACE -D LOG_PREAMBLE='""'
